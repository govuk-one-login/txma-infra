AWSTemplateFormatVersion: '2010-09-09'
Description: Static infrastructure for Shared Signal Framework
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Description: The environment type
    Type: String
    AllowedValues:
      - dev
      - build
      - staging
      - integration
      - production
  AudienceGSI:
    Description: Name of the audience GSI
    Type: String
    Default: audGSI
  PermissionsBoundary:
    Description: The ARN of the permissions boundary to apply to any role created by the template
    Type: String
    Default: none
  FeatureTestImageOrganizationIds:
    Description: Comma-separated AWS Organization IDs permitted to pull the dev feature branch test image
    Type: CommaDelimitedList
    Default: 'o-pjzf8d99ys,o-dpp53lco28'

Conditions:
  IsDev: !Equals [!Ref Environment, dev]
  IsStaging: !Equals [!Ref Environment, staging]
  IsBuildOrStaging:
    !Or [!Equals [!Ref Environment, build], !Equals [!Ref Environment, staging]]
  NotTestEnvironment:
    !Or [
      !Equals [!Ref Environment, production],
      !Equals [!Ref Environment, integration]
    ]
  TestEnvironment: !Not [Condition: NotTestEnvironment]
  UsePermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundary, none]]

# EnvironmentPipelineNames are the shortened environment names that the pipeline uses
Mappings:
  EnvironmentPipelineNames:
    dev:
      PipelineName: 'dev'
    build:
      PipelineName: 'build'
    staging:
      PipelineName: 'stg'
    integration:
      PipelineName: 'int'
    production:
      PipelineName: 'prod'

Resources:
  ####################
  # DynamoDB Resources
  ####################

  UserConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: aud
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: !Ref AudienceGSI
          KeySchema:
            - AttributeName: aud
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: '{{resolve:ssm:DatabaseKmsKeyArn}}'
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TableName: !Sub ${AWS::StackName}-user-config
      Tags:
        - Key: BackupFrequency
          Value: Bihourly
      DeletionProtectionEnabled: true

  MockReceiverSETTable:
    Type: AWS::DynamoDB::Table
    Condition: TestEnvironment
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    #checkov:skip=CKV_AWS_28:Test-only table, PITR not required
    #checkov:skip=CKV_AWS_119:Test-only table, AWS-owned encryption is sufficient
    Properties:
      TableName: !Sub ${AWS::StackName}-mock-receiver-set-table
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
        - AttributeName: clientId
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH
        - AttributeName: clientId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ####################
  # CloudWatch Alarms
  ####################

  UserConfigTableReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !ImportValue slack-build-notifications-CriticalAlertsTopicArn
      AlarmDescription: >-
        Alarm that monitors read throttle events on the UserConfig DynamoDB table.
        Triggers when any read throttle events occur within a 1 minute period.
      AlarmName: !Sub ${AWS::StackName}-user-config-table-read-throttle-events
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: TableName
          Value: !Ref UserConfigTable
      EvaluationPeriods: 1
      MetricName: ReadThrottleEvents
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 60
      Threshold: 0
      TreatMissingData: notBreaching

  UserConfigTableWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !ImportValue slack-build-notifications-CriticalAlertsTopicArn
      AlarmDescription: >-
        Alarm that monitors write throttle events on the UserConfig DynamoDB table.
        Triggers when any write throttle events occur within a 1 minute period.
      AlarmName: !Sub ${AWS::StackName}-user-config-table-write-throttle-events
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: TableName
          Value: !Ref UserConfigTable
      EvaluationPeriods: 1
      MetricName: WriteThrottleEvents
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 60
      Threshold: 0
      TreatMissingData: notBreaching

  ####################
  # Cognito Resources
  ####################

  SSFUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-ssf-user-pool

  SSFUserPoolDomain:
    Condition: IsDev # Custom domain name for higher envs defined in DNS repo
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub di-txma-${AWS::StackName}-${Environment}-ssf-auth
      UserPoolId: !Ref SSFUserPool

  SharedSignalsStreamResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref SSFUserPool
      Identifier: 'stream'
      Name: !Sub '${AWS::StackName}-stream-resource-server'
      Scopes:
        - ScopeDescription: 'Allows read access to the SSF stream config'
          ScopeName: 'read'

  ################
  # SSM Parameters
  ################

  UserConfigTableArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: UserConfigTableArn
      Type: String
      Value: !GetAtt UserConfigTable.Arn

  UserConfigTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: UserConfigTableName
      Type: String
      Value: !Ref UserConfigTable

  UserConfigTableAudienceGSIParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: UserConfigTableAudienceGSI
      Type: String
      Value: !Ref AudienceGSI

  UserConfigTableStreamArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: UserConfigTableStreamArn
      Type: String
      Value: !GetAtt UserConfigTable.StreamArn

  SSFUserPoolIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: SSFUserPoolId
      Type: String
      Value: !Ref SSFUserPool

  SSFUserPoolArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: SSFUserPoolArn
      Type: String
      Value: !GetAtt SSFUserPool.Arn

  CognitoDomainURLParameter:
    Condition: IsDev # Custom domain name for higher envs defined in DNS repo
    Type: AWS::SSM::Parameter
    Properties:
      Name: CognitoDomainUrl
      Type: String
      Value: !Sub https://${SSFUserPoolDomain}.auth.eu-west-2.amazoncognito.com

  #############################
  # Integration test Resources
  ############################

  ######################################
  # Test producer queue resources START
  ######################################
  IntegrationTestProducerQueue:
    Type: AWS::SQS::Queue
    Condition: IsStaging
    Properties:
      QueueName: !Sub ${AWS::StackName}-${Environment}-test-producer-queue
      KmsMasterKeyId: !GetAtt IntegrationTestProducerQueueKmsKey.Arn
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IntegrationTestProducerDeadLetterQueue.Arn
        maxReceiveCount: 5

  IntegrationTestProducerQueueQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: IsStaging
    Properties:
      Queues:
        - !Ref IntegrationTestProducerQueue
      PolicyDocument:
        Statement:
          - Sid: AllowEventProcessingAccountQueueRead
            Action:
              - 'sqs:ChangeMessageVisibility'
              - 'sqs:DeleteMessage'
              - 'sqs:GetQueueAttributes'
              - 'sqs:ReceiveMessage'
            Effect: 'Allow'
            Resource: !GetAtt IntegrationTestProducerQueue.Arn
            Principal:
              AWS:
                - '{{resolve:ssm:EventProcessingAccountRootArn}}'

  IntegrationTestProducerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: IsStaging
    Properties:
      QueueName: !Sub ${AWS::StackName}-${Environment}-test-producer-dlq
      KmsMasterKeyId: !GetAtt IntegrationTestProducerQueueKmsKey.Arn

  IntegrationTestProducerQueueKmsKey:
    Type: AWS::KMS::Key
    Condition: IsStaging
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable Root access
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:*
            Resource: '*'
          - Sid: Enable Decrypt access for Event Processing
            Effect: Allow
            Principal:
              AWS: '{{resolve:ssm:EventProcessingAccountRootArn}}'
            Action:
              - kms:Decrypt
            Resource: '*'
          - Sid: Allow AWS Lambda access
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Encrypt
              - kms:Decrypt
            Resource: '*'

  IntegrationTestProducerQueueKmsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: IsStaging
    Properties:
      AliasName: !Sub alias/${AWS::StackName}/${Environment}/integration-test-producer-queue-kms-key
      TargetKeyId: !Ref IntegrationTestProducerQueueKmsKey

  ######################################
  # Test producer queue resources END
  ######################################

  CognitoTestUsers:
    #checkov:skip=CKV_AWS_149:We will use aws managed kms key
    Type: AWS::SecretsManager::Secret
    Condition: TestEnvironment
    Properties:
      Description: 'A set of TEST cognito users that can be used to authenticate against shared signals API Gateway. Used for testing only'
      Name: APIGatewayTestUserCredentials

  CognitoTestUsersSecretArnParameter:
    Type: AWS::SSM::Parameter
    Condition: TestEnvironment
    Properties:
      Name: CognitoTestUsersArn
      Type: String
      Value: !Ref CognitoTestUsers

  IntegrationTestProducerQueueArnParameter:
    Type: AWS::SSM::Parameter
    Condition: IsStaging
    Properties:
      Name: IntegrationTestProducerQueueArn
      Type: String
      Value: !GetAtt IntegrationTestProducerQueue.Arn

  IntegrationTestProducerQueueKmsKeyArnParameter:
    Type: AWS::SSM::Parameter
    Condition: IsStaging
    Properties:
      Name: IntegrationTestProducerQueueKmsKeyArn
      Type: String
      Value: !GetAtt IntegrationTestProducerQueueKmsKey.Arn

  IntegrationTestProducerQueueUrlParameter:
    Type: AWS::SSM::Parameter
    Condition: IsStaging
    Properties:
      Name: IntegrationTestProducerQueueUrl
      Type: String
      Value: !Ref IntegrationTestProducerQueue

  MockReceiverSETTableNameParameter:
    Type: AWS::SSM::Parameter
    Condition: TestEnvironment
    Properties:
      Name: /tests/MockReceiverSETTableName
      Type: String
      Value: !Ref MockReceiverSETTable

  MockReceiverSETTableArnParameter:
    Type: AWS::SSM::Parameter
    Condition: TestEnvironment
    Properties:
      Name: /tests/MockReceiverSETTableArn
      Type: String
      Value: !GetAtt MockReceiverSETTable.Arn

  ####################
  # SET signing keys
  ####################

  SETSigningKMSKey2:
    #checkov:skip=CKV_AWS_7:We explicitly don't want key rotation for this, because we need to manage it in a controlled way if we do it
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: KMS key for SET signing and verification. Deployed on 2024/11/12
      # we need to use ES256 for signing SET
      # reasoning for using ES256: https://govukverify.atlassian.net/wiki/spaces/TMA/pages/4693950567/Signing+SET+and+Key+rotating
      KeySpec: 'ECC_NIST_P256'
      KeyUsage: 'SIGN_VERIFY'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:*
            Resource: '*'
          - !If
            - IsBuildOrStaging
            - Sid: AllowTestRoleAccess
              Effect: Allow
              Principal:
                AWS:
                  Fn::ImportValue: !Sub
                    - ssf-${pipelineFriendEnv}-pipeline-TestRoleArn
                    - pipelineFriendEnv:
                        !FindInMap [
                          EnvironmentPipelineNames,
                          !Ref Environment,
                          PipelineName
                        ]
              Action:
                - kms:*
              Resource: '*'
            - !Ref AWS::NoValue

  SETSigningKMSKeyAlias2:
    Type: 'AWS::KMS::Alias'
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-SET-signing-key-2
      TargetKeyId: !Ref SETSigningKMSKey2

  SETSigningKMSKey2RSAArn:
    #checkov:skip=CKV_AWS_7:We explicitly don't want key rotation for this, because we need to manage it in a controlled way if we do it
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: KMS key for SET signing and verification
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:*
            Resource: '*'
          - !If
            - IsBuildOrStaging
            - Sid: AllowTestRoleAccess
              Effect: Allow
              Principal:
                AWS:
                  Fn::ImportValue: !Sub
                    - ssf-${pipelineFriendEnv}-pipeline-TestRoleArn
                    - pipelineFriendEnv:
                        !FindInMap [
                          EnvironmentPipelineNames,
                          !Ref Environment,
                          PipelineName
                        ]
              Action:
                - kms:*
              Resource: '*'
            - !Ref AWS::NoValue
      KeySpec: RSA_4096
      KeyUsage: SIGN_VERIFY

  SETSigningKMSKey2RSAAlias:
    Type: 'AWS::KMS::Alias'
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-SET-signing-key-2-rsa
      TargetKeyId: !Ref SETSigningKMSKey2RSAArn

  MetricsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !Sub ${AWS::StackName}-${Environment}-metrics
      LoggingConfiguration:
        DestinationBucketName: '{{resolve:ssm:S3LogsBucketName}}'
        LogFilePrefix: !Sub ${AWS::StackName}-${Environment}-metrics/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: BackupFrequency
          Value: Bihourly

  MetricsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MetricsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyDeletion
            Effect: Deny
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
            Resource:
              - !GetAtt MetricsBucket.Arn
              - !Sub ${MetricsBucket.Arn}/*
            Principal:
              AWS: '*'

  MetricsAthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !Sub ${AWS::StackName}-${Environment}-metrics-athena-results
      LifecycleConfiguration:
        Rules:
          - Id: AnalysisCleanupRule
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      LoggingConfiguration:
        DestinationBucketName: '{{resolve:ssm:S3LogsBucketName}}'
        LogFilePrefix: !Sub ${AWS::StackName}-${Environment}-metrics-athena-results/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  MetricsAthenaResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MetricsAthenaResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyDeletion
            Effect: Deny
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
            Resource:
              - !GetAtt MetricsAthenaResultsBucket.Arn
              - !Sub ${MetricsAthenaResultsBucket.Arn}/*
            Principal:
              AWS: '*'

  MetricsAthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub ${AWS::StackName}-${Environment}-metrics
      Description: WorkGroup for querying metric records in Athena
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub s3://${MetricsAthenaResultsBucket}/query-results/
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  MetricsGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Join
          - '_'
          - - !Join ['_', !Split ['-', !Ref 'AWS::StackName']]
            - !Ref Environment
            - metrics
        Description: Database for querying metric records in Athena

  MetricsGlueTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref MetricsGlueDatabase
      TableInput:
        Description: Table to query delivered signal records from the metrics bucket
        Name: !Join
          - '_'
          - - !Join ['_', !Split ['-', !Ref 'AWS::StackName']]
            - !Ref Environment
            - delivered_signals
        Parameters:
          classification: json
          projection.enabled: true
          projection.delivered_date.type: date
          projection.delivered_date.range: 2024-01-01,NOW
          projection.delivered_date.format: yyyy-MM-dd
          projection.delivered_date.interval: 1
          projection.delivered_date.interval.unit: DAYS
          projection.delivered_hour.type: integer
          projection.delivered_hour.range: 0,23
          projection.delivered_hour.digits: 2
          storage.location.template: !Sub 's3://${MetricsBucket}/metric_name=DELIVERED_SIGNAL/delivered_date=${!delivered_date}/delivered_hour=${!delivered_hour}/'
        PartitionKeys:
          - Name: delivered_date
            Type: date
          - Name: delivered_hour
            Type: int
        StorageDescriptor:
          Columns:
            - Name: audit_event_name
              Type: string
            - Name: signal_name
              Type: string
            - Name: rp_user_client_id
              Type: string
            - Name: friendly_name
              Type: string
            - Name: event_id
              Type: string
            - Name: timestamp
              Type: bigint
          Compressed: true
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          Location: !Sub s3://${MetricsBucket}/metric_name=DELIVERED_SIGNAL/
          OutputFormat: org.apache.hadoop.hive.ql.io.IgnoreKeyTextOutputFormat
          SerdeInfo:
            Parameters:
              {
                'ignore.malformed.json': true,
                'serialization.format': 1,
                'case.insensitive': false
              }
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          StoredAsSubDirectories: false
        TableType: EXTERNAL_TABLE

  MetricsFirehoseLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: '{{resolve:ssm:LogsKmsKeyArn}}'
      LogGroupName: !Sub /aws/kinesisfirehose/${AWS::StackName}-metrics
      RetentionInDays: 30

  MetricsFirehoseDestinationLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref MetricsFirehoseLogs
      LogStreamName: DestinationDelivery

  MetricsFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-metrics-firehose-role
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowFirehoseToAssumeRole
            Effect: Allow
            Principal:
              Service:
                - firehose.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref MetricsFirehosePolicy

  MetricsFirehosePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AWS::StackName}-metrics-firehose-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Access
            Effect: Allow
            Action:
              - s3:AbortMultipartUpload
              - s3:GetBucketLocation
              - s3:GetObject
              - s3:ListBucket
              - s3:ListBucketMultipartUploads
              - s3:PutObject
            Resource:
              - !GetAtt MetricsBucket.Arn
              - !Sub ${MetricsBucket.Arn}/*
          - Sid: AllowFirehoseLogging
            Effect: Allow
            Action:
              - logs:PutLogEvents
            Resource:
              - !GetAtt MetricsFirehoseLogs.Arn

  MetricsDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub ${AWS::StackName}-metrics
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt MetricsBucket.Arn
        RoleARN: !GetAtt MetricsFirehoseRole.Arn
        BufferingHints:
          IntervalInSeconds: !If
            - TestEnvironment
            - 60
            - 900
          SizeInMBs: 128
        CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref MetricsFirehoseLogs
          LogStreamName: !Ref MetricsFirehoseDestinationLogStream
        DynamicPartitioningConfiguration:
          Enabled: true
        Prefix: !Sub 'metric_name=!{partitionKeyFromQuery:metric_name}/delivered_date=!{partitionKeyFromQuery:delivered_date}/delivered_hour=!{partitionKeyFromQuery:delivered_hour}/'
        ErrorOutputPrefix: 'failures/!{firehose:error-output-type}/'
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: MetadataExtraction
              Parameters:
                - ParameterName: MetadataExtractionQuery
                  ParameterValue: '{metric_name:.metric_name,delivered_date:(.timestamp|strftime("%Y-%m-%d")),delivered_hour:(.timestamp|strftime("%H"))}'
                - ParameterName: JsonParsingEngine
                  ParameterValue: JQ-1.6
            - Type: AppendDelimiterToRecord
              Parameters:
                - ParameterName: Delimiter
                  ParameterValue: '\n'
        S3BackupMode: Disabled

  #########################################
  # Feature branch integration test runner
  #########################################

  FeatureBranchIntegrationTestImageRepository:
    Type: AWS::ECR::Repository
    Condition: IsDev
    # Temporary infrastructure: delete alongside the runner when ephemeral tests/dev pipeline land.
    #checkov:skip=CKV_AWS_136:Feature test images are non-sensitive and AWS-managed encryption is sufficient
    Properties:
      RepositoryName: !Sub ${AWS::StackName}-feature-branch-integration-tests
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire temporary feature test images after 14 days",
                "selection": {
                  "tagStatus": "any",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOrganisationPull
            Effect: Allow
            Principal: '*'
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref FeatureTestImageOrganizationIds
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-feature-branch-integration-tests

  FeatureBranchIntegrationTestSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsDev
    Properties:
      GroupDescription: Allow the feature branch test runner to call HTTPS endpoints
      SecurityGroupEgress:
        # Egress is scoped to in-VPC destinations only:
        #  - the shared interface-endpoint SG covers ECR API/DKR, Logs, KMS, STS/SSM,
        #    Secrets Manager, execute-api, Firehose, etc. (reached via private DNS
        #    resolving to the VPC interface endpoint ENIs).
        #  - the S3 gateway prefix list covers ECR image-layer downloads from S3.
        - DestinationSecurityGroupId: !ImportValue vpc-AWSServicesEndpointSecurityGroupId
          Description: Allow HTTPS to the VPC interface endpoints (ECR API/DKR, Logs, KMS, STS/SSM, Secrets Manager, execute-api, Firehose)
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
        - DestinationPrefixListId: pl-7ca54015 # eu-west-2 S3 gateway endpoint prefix list (com.amazonaws.eu-west-2.s3)
          Description: Allow HTTPS to S3 via the gateway endpoint (ECR image layer download)
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      VpcId: !ImportValue vpc-VpcId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-feature-branch-integration-tests

  FeatureBranchIntegrationTestLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsDev
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      KmsKeyId: '{{resolve:ssm:LogsKmsKeyArn}}'
      LogGroupName: !Sub /aws/codebuild/${AWS::StackName}-feature-branch-integration-tests
      RetentionInDays: 30

  FeatureBranchIntegrationTestReportGroup:
    Type: AWS::CodeBuild::ReportGroup
    Condition: IsDev
    Properties:
      DeleteReports: true
      ExportConfig:
        ExportConfigType: NO_EXPORT
      Name: !Sub ${AWS::StackName}-feature-branch-integration-tests
      Type: TEST
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-feature-branch-integration-tests

  FeatureBranchIntegrationTestExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsDev
    #checkov:skip=CKV_AWS_111:EC2 describe and ENI lifecycle actions do not support useful resource-level restrictions
    #checkov:skip=CKV_AWS_356:ListUserPools and ECR authorization token actions require Resource '*'
    Properties:
      Description: Runtime permissions for the VPC-attached feature branch CodeBuild project
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: WriteBuildLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt FeatureBranchIntegrationTestLogGroup.Arn
              - !Sub ${FeatureBranchIntegrationTestLogGroup.Arn}:*
          - Sid: PublishTestReports
            Effect: Allow
            Action:
              - codebuild:BatchPutTestCases
              - codebuild:CreateReport
              - codebuild:UpdateReport
            Resource: !GetAtt FeatureBranchIntegrationTestReportGroup.Arn
          - Sid: PullSharedSignalsTestImages
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !GetAtt FeatureBranchIntegrationTestImageRepository.Arn
          - Sid: GetEcrAuthorizationToken
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: ManageCodeBuildNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:DescribeDhcpOptions
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
            Resource: '*'
          - Sid: AuthorizeCodeBuildNetworkInterfaces
            Effect: Allow
            Action: ec2:CreateNetworkInterfacePermission
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
            Condition:
              StringEquals:
                ec2:AuthorizedService: codebuild.amazonaws.com
              ArnEquals:
                ec2:Subnet:
                  - !Sub
                    - arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SubnetId}
                    - SubnetId: !ImportValue vpc-ProtectedSubnetIdA
                  - !Sub
                    - arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SubnetId}
                    - SubnetId: !ImportValue vpc-ProtectedSubnetIdB

  FeatureBranchIntegrationTestPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsDev
    # Stack names are supplied per execution, so read-only discovery cannot be scoped to one static stack ARN.
    #checkov:skip=CKV_AWS_111:Read/list APIs and runtime-selected test resources require wildcard resources; mutations use constrained ARNs
    #checkov:skip=CKV_AWS_356:List/read APIs without resource-level authorization require Resource '*'
    Properties:
      Description: Least-privilege application and setup access for feature branch integration tests
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DescribeFeatureAndDynamicStacks
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/*/*
          - Sid: UpdateDynamicRpUserStacks
            Effect: Allow
            Action: cloudformation:UpdateStack
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/txma-dynamic-sqs-set-push-*/*
          - Sid: ReadTestParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tests/*
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/SecretsKmsKeyArn
          - Sid: WriteStackTestParameters
            Effect: Allow
            Action: ssm:PutParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tests/*
          - Sid: FindTestSecretsAndUserPools
            Effect: Allow
            Action:
              - cognito-idp:ListUserPools
              - secretsmanager:ListSecrets
            Resource: '*'
          - Sid: CreateIntegrationTestCognitoClients
            Effect: Allow
            Action: cognito-idp:CreateUserPoolClient
            Resource: !GetAtt SSFUserPool.Arn
          - Sid: ReadAndUpdateRpUserSecrets
            Effect: Allow
            Action:
              - secretsmanager:CancelRotateSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:RotateSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
              - secretsmanager:UpdateSecret
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:txma-dynamic-sqs-set-push-*
          - Sid: UseSecretsKmsKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
            Resource: '{{resolve:ssm:SecretsKmsKeyArn}}'
          - Sid: ConfigureSharedUserData
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt UserConfigTable.Arn
              - !Sub ${UserConfigTable.Arn}/index/*
          - Sid: ReadMockReceiverTestData
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt MockReceiverSETTable.Arn
              - !Sub ${MockReceiverSETTable.Arn}/index/*
          - Sid: InvokeFeatureApis
            Effect: Allow
            Action: execute-api:Invoke
            Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*
          - Sid: UseFeatureTestQueues
            Effect: Allow
            Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:PurgeQueue
              - sqs:ReceiveMessage
              - sqs:SendMessage
            Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:*
          - Sid: InvokeFeatureTestFunctions
            Effect: Allow
            Action:
              - lambda:InvokeFunction
              - lambda:ListAliases
              - lambda:ListEventSourceMappings
            Resource: '*'
          - Sid: SignTestSets
            Effect: Allow
            Action:
              - kms:GetPublicKey
              - kms:Sign
              - kms:Verify
            Resource:
              - !GetAtt SETSigningKMSKey2.Arn
              - !GetAtt SETSigningKMSKey2RSAArn.Arn
          - Sid: ReadFeatureLogs
            Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:GetLogEvents
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:log-stream:*
          - Sid: RepairDynamicStackEventMappings
            Effect: Allow
            Action:
              - lambda:CreateEventSourceMapping
              - lambda:DeleteEventSourceMapping
              - lambda:GetEventSourceMapping
              - lambda:UpdateEventSourceMapping
            Resource: '*'
          - Sid: MaintainDynamicStackQueues
            Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:SetQueueAttributes
              - sqs:TagQueue
              - sqs:UntagQueue
            Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:txma-dynamic-sqs-set-push-*
          - Sid: MaintainDynamicStackSecrets
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:PutResourcePolicy
              - secretsmanager:RemoveRegionsFromReplication
              - secretsmanager:ReplicateSecretToRegions
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:txma-dynamic-sqs-set-push-*
          - Sid: MaintainDynamicStackAlarms
            Effect: Allow
            Action:
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:PutMetricAlarm
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:txma-dynamic-sqs-set-push-*
          - Sid: MaintainDynamicStackRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/txma-dynamic-sqs-set-push-*

  FeatureBranchIntegrationTestRole:
    Type: AWS::IAM::Role
    Condition: IsDev
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCodeBuildToAssumeRole
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Description: Runs Shared Signals feature branch integration tests inside the dev VPC
      ManagedPolicyArns:
        - !Ref FeatureBranchIntegrationTestExecutionPolicy
        - !Ref FeatureBranchIntegrationTestPolicy
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-feature-branch-integration-tests

  FeatureBranchIntegrationTestProject:
    Type: AWS::CodeBuild::Project
    Condition: IsDev
    Properties:
      Artifacts:
        Type: NO_ARTIFACTS
      ConcurrentBuildLimit: 2
      Description: Runs integration tests for feature stacks from inside the Shared Signals dev VPC
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: AUTO_PROVISION_RP_USERS
            Type: PLAINTEXT
            Value: 'true'
          - Name: REPORT_GROUP_ARN
            Type: PLAINTEXT
            Value: !GetAtt FeatureBranchIntegrationTestReportGroup.Arn
          - Name: TEST_ENVIRONMENT
            Type: PLAINTEXT
            Value: dev
          - Name: TEST_SUITE
            Type: PLAINTEXT
            Value: integration
        # Every real execution must replace this bootstrap image with the commit image by digest.
        Image: aws/codebuild/standard:7.0
        ImagePullCredentialsType: SERVICE_ROLE
        PrivilegedMode: false
        Type: LINUX_CONTAINER
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Ref FeatureBranchIntegrationTestLogGroup
          Status: ENABLED
          StreamName: feature-branch
        S3Logs:
          Status: DISABLED
      Name: !Sub ${AWS::StackName}-feature-branch-integration-tests
      QueuedTimeoutInMinutes: 60
      ServiceRole: !GetAtt FeatureBranchIntegrationTestRole.Arn
      Source:
        BuildSpec: |
          version: 0.2

          phases:
            pre_build:
              commands:
                - mkdir -p /tmp/test-reports
                - export TEST_REPORT_ABSOLUTE_DIR=/tmp/test-reports
                - ': "${STACK_NAME:?STACK_NAME must be supplied by the deployment job}"'
                - ': "${TEST_IMAGE_DIGEST:?TEST_IMAGE_DIGEST must be supplied by the image job}"'
                - ': "${GIT_COMMIT:?GIT_COMMIT must be supplied by the workflow}"'
                - test "$TEST_ENVIRONMENT" = dev
                - test "$TEST_SUITE" = integration
                - test "$AUTO_PROVISION_RP_USERS" = true
                - |
                  case "$CODEBUILD_BUILD_IMAGE" in
                    *@sha256:*) ;;
                    *) echo "The CodeBuild image must be overridden with an immutable digest" >&2; exit 1 ;;
                  esac
                - |
                  case "$TEST_IMAGE_DIGEST" in
                    sha256:*) test "${CODEBUILD_BUILD_IMAGE##*@}" = "$TEST_IMAGE_DIGEST" ;;
                    *@sha256:*) test "$CODEBUILD_BUILD_IMAGE" = "$TEST_IMAGE_DIGEST" ;;
                    *) echo "TEST_IMAGE_DIGEST must be a sha256 digest or digest-addressed image URI" >&2; exit 1 ;;
                  esac
                - aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text
            build:
              commands:
                - /run-tests.sh
          reports:
            $REPORT_GROUP_ARN:
              base-directory: $TEST_REPORT_ABSOLUTE_DIR
              files:
                - junit.xml
              file-format: JUNITXML
        Type: NO_SOURCE
      TimeoutInMinutes: 180
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt FeatureBranchIntegrationTestSecurityGroup.GroupId
        Subnets:
          - !ImportValue vpc-ProtectedSubnetIdA
          - !ImportValue vpc-ProtectedSubnetIdB
        VpcId: !ImportValue vpc-VpcId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-feature-branch-integration-tests
        - Key: Service
          Value: shared-signals

Outputs:
  FeatureBranchIntegrationTestImageRepositoryUri:
    Condition: IsDev
    Description: URI of the dev-owned ECR repository for temporary feature branch test images
    Value: !GetAtt FeatureBranchIntegrationTestImageRepository.RepositoryUri
  FeatureBranchIntegrationTestProjectName:
    Condition: IsDev
    Description: Name of the shared in-VPC feature branch integration test project
    Value: !Ref FeatureBranchIntegrationTestProject
  FeatureBranchIntegrationTestProjectArn:
    Condition: IsDev
    Description: ARN of the shared in-VPC feature branch integration test project
    Value: !GetAtt FeatureBranchIntegrationTestProject.Arn
  SSFUserPoolId:
    Description: 'user pool id for cognito'
    Value: !Ref SSFUserPool
  UserConfigTableName:
    Description: 'table name for user config table'
    Value: !Ref UserConfigTable
  SETSigningKMSKey2Arn:
    Description: 'the arn of SET signing key 2'
    Value: !GetAtt SETSigningKMSKey2.Arn
    Export:
      Name: SETSigningKMSKey2Arn
  SETSigningKMSKey2RSAArn:
    Description: 'the arn of SET signing key 2'
    Value: !GetAtt SETSigningKMSKey2RSAArn.Arn
    Export:
      Name: SETSigningKMSKey2RSAArn
  MetricsBucketName:
    Description: 'The name of the S3 bucket that stores metric records'
    Value: !Ref MetricsBucket
  MetricsDeliveryStreamName:
    Description: 'The name of the Firehose delivery stream for metrics'
    Value: !Ref MetricsDeliveryStream
  MetricsGlueTableName:
    Description: 'The Glue table for querying metric records in Athena'
    Value: !Ref MetricsGlueTable

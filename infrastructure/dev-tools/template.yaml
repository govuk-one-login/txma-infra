  IntegrationTestRunnerTaskExecutionRole:
    Condition: FeatureBranches
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-integration-test-runner-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: CreateLogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
        - PolicyName: PullFromEcr
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt EcrEncryptionKey.Arn
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue

  EcrEncryptionKey:
    Condition: FeatureBranches
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for ECR repository encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  EcrEncryptionKeyAlias:
    Condition: FeatureBranches
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-ecr-integration-tests
      TargetKeyId: !Ref EcrEncryptionKey

  DevContainerSigningKey:
    Condition: FeatureBranches
    Type: AWS::KMS::Key
    Properties:
      Description: Asymmetric key for container image signing (Cosign)
      KeyUsage: SIGN_VERIFY
      KeySpec: ECC_NIST_P256
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  ContainerSigningKeyAlias:
    Condition: FeatureBranches
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-dev-container-signing
      TargetKeyId: !Ref DevContainerSigningKey
